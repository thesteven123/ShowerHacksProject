<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Menaces — Character preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
      }
      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid #333;
      }
      main { padding: 1.25rem; display: flex; gap: 1.5rem; flex-wrap: wrap; }
      canvas {
        background: repeating-conic-gradient(#2a2a3a 0% 25%, #222 0% 50%) 50% / 16px 16px;
        border-radius: 8px;
        cursor: crosshair;
      }
      .panel { max-width: 320px; }
      label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: #aaa; }
      select, input[type="file"] { width: 100%; margin-top: 0.25rem; }
      .hit { color: #ff6b6b; font-weight: 600; }
      ul { padding-left: 1.2rem; }
    </style>
  </head>
  <body>
    <header>
      <strong>Tiny Menaces</strong> — Character preview (Person 2 / Person 3 handoff)
    </header>
    <main>
      <div>
        <canvas id="stage" width="480" height="320"></canvas>
        <p id="status" style="font-size: 0.9rem; color: #aaa; margin-top: 0.5rem">
          Click the gremlin to test hitbox. Stand-in for Electron overlay at midpoint.
        </p>
      </div>
      <div class="panel">
        <label>Character</label>
        <select id="roster"></select>
        <label>Clip</label>
        <select id="clip">
          <option value="idle">idle</option>
          <option value="walk">walk</option>
          <option value="hit">hit</option>
          <option value="respawn">respawn</option>
        </select>
        <label>Upload photo (createCharacterFromPhoto API demo)</label>
        <input type="file" id="upload" accept="image/*" />
        <div id="quote" style="margin-top: 1rem; font-style: italic"></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
